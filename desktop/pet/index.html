<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'" />
    <title>聚宝盆桌宠</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="pet" class="pet" role="button" tabindex="0" aria-label="收取聚宝盆中的 Token">
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <div class="companion-scene" id="scene" data-pending="false">
        <div class="basin-aura" aria-hidden="true"></div>
        <img class="pet-image basin-image" id="pet-image" src="./assets/processed/jade-basin.webp" alt="青玉聚宝盆" draggable="false" />
        <div class="energy-ripple" aria-hidden="true"></div>
        <span class="energy-thread" aria-hidden="true"></span>
        <span class="energy-thread" aria-hidden="true"></span>
        <span class="energy-thread" aria-hidden="true"></span>
      </div>
      <div class="pending-label" id="pending-label" aria-hidden="true"></div>
    </main>
    <script src="./pet.js"></script>
  </body>
</html>
